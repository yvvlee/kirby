mode: single

http:
  address: "127.0.0.1:14173"
  timeout: 2m

grpc:
  address: "127.0.0.1:19090"
  timeout: 10s

mysql:
  dsn: "root:kirby-e2e-password@tcp(127.0.0.1:33306)/kirby?charset=utf8mb4&parseTime=true&loc=UTC"
  max_open_conns: 20
  max_idle_conns: 5
  conn_max_lifetime: 5m

cache:
  driver: memory
  redis:
    address: ""
    username: ""
    password: ""
    db: 0
    key_prefix: ""

jwt:
  issuer: kirby-e2e
  active_kid: e2e-primary
  access_ttl: 15m
  refresh_ttl: 168h
  keys:
    e2e-primary: kirby-e2e-jwt-key-012345678901234567890123

security:
  api_key_pepper: kirby-e2e-api-key-pepper-012345678901234567
  allowed_origins:
    - "http://127.0.0.1:14173"
  trusted_proxies: []

object_storage:
  driver: local
  local:
    directory: "/tmp/kirby-e2e-objects"
  s3:
    endpoint: ""
    presign_endpoint: ""
    region: ""
    bucket: ""
    access_key: ""
    secret_key: ""
    use_ssl: false
    public_base_url: ""

log:
  level: info
  format: json
