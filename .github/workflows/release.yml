name: Release

on:
  release:
    types:
      - published

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  GO_VERSION: 1.27.2
  NODE_VERSION: 24.19.0
  GOTOOLCHAIN: local
  KIRBY_IMAGE: docker.io/mshadow/kirby

jobs:
  release:
    name: Verify and publish
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          ref: ${{ github.event.release.tag_name }}
      - name: Check Docker Hub credentials
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          test -n "$DOCKERHUB_USERNAME" || { echo "DOCKERHUB_USERNAME secret is required" >&2; exit 1; }
          test -n "$DOCKERHUB_TOKEN" || { echo "DOCKERHUB_TOKEN secret is required" >&2; exit 1; }
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: server/go.sum
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Verify signed annotated tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! printf '%s\n' "$GITHUB_REF_NAME" | grep -Eq '^v(0|[1-9][0-9]*)[.](0|[1-9][0-9]*)[.](0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$'; then
            echo "invalid release tag: $GITHUB_REF_NAME" >&2
            exit 1
          fi
          ref_json=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$GITHUB_REF_NAME")
          test "$(printf '%s' "$ref_json" | jq -r '.object.type')" = tag
          tag_sha=$(printf '%s' "$ref_json" | jq -r '.object.sha')
          tag_json=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_sha")
          test "$(printf '%s' "$tag_json" | jq -r '.verification.verified')" = true
          test "$(printf '%s' "$tag_json" | jq -r '.verification.reason')" = valid
          test "$(printf '%s' "$tag_json" | jq -r '.object.type')" = commit
          test "$(printf '%s' "$tag_json" | jq -r '.object.sha')" = "$GITHUB_SHA"
      - name: Set release metadata
        id: metadata
        env:
          IS_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          {
            echo "VERSION=${GITHUB_REF_NAME#v}"
            echo "BUILD_DATE=$(git show -s --format=%cI "$GITHUB_SHA")"
          } >> "$GITHUB_ENV"
          {
            echo 'tags<<EOF'
            echo "$KIRBY_IMAGE:$GITHUB_REF_NAME"
            echo "$KIRBY_IMAGE:sha-$GITHUB_SHA"
            # Prerelease tags must never replace the stable image.
            if [ "$IS_PRERELEASE" = false ] && ! printf '%s' "$GITHUB_REF_NAME" | grep -q -- '-'; then
              echo "$KIRBY_IMAGE:latest"
            fi
            echo EOF
          } >> "$GITHUB_OUTPUT"
      - name: Install protoc
        run: scripts/ci/install-protoc.sh
      - name: Run release gates
        run: |
          make ci
          scripts/test-clean-room.sh
          scripts/release-check.sh --dry-run "$GITHUB_REF_NAME"
      - name: Generate release SBOMs
        run: |
          KIRBY_SOURCE_COMMIT="$GITHUB_SHA" \
            KIRBY_RELEASE_VERSION="$VERSION" \
            KIRBY_BUILD_DATE="$BUILD_DATE" \
            scripts/generate-sbom.sh
          cp dist/sbom/*.cdx.json dist/release/
          (cd dist/release && sha256sum -- kirby-* *.cdx.json > SHA256SUMS)
      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          version: v0.36.1
          driver-opts: image=moby/buildkit:v0.32.2@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8
      - name: Build and push Kirby image
        id: image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          pull: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.VERSION }}
          build-args: |
            VERSION=${{ env.VERSION }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ env.BUILD_DATE }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=release-image
          cache-to: type=gha,mode=max,scope=release-image
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: Sign image manifests with GitHub OIDC
        run: |
          cosign sign --yes "${KIRBY_IMAGE}@${{ steps.image.outputs.digest }}"
      - name: Attest release files
        uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f # v3.2.0
        with:
          subject-path: dist/release/*
      - name: Sign release files with GitHub OIDC
        run: |
          for artifact in dist/release/*; do
            cosign sign-blob --yes --bundle "$artifact.sigstore.json" "$artifact"
          done
      - name: Upload GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" dist/release/* --clobber
