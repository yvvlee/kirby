name: Release

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: Existing published release tag to build
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

env:
  GO_VERSION: 1.27.2
  NODE_VERSION: 24.19.0
  GOTOOLCHAIN: local
  KIRBY_IMAGE: docker.io/mshadow/kirby
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  release:
    name: Verify and publish
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - name: Prepare release tools
        run: |
          if ! printf '%s\n' "$RELEASE_TAG" | grep -Eq '^v(0|[1-9][0-9]*)[.](0|[1-9][0-9]*)[.](0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$'; then
            echo "invalid release tag: $RELEASE_TAG" >&2
            exit 1
          fi
          # Keep the current release helper when retrying an older source tag.
          cp scripts/release-check.sh "$RUNNER_TEMP/kirby-release-check.sh"
      - name: Check out release source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_TAG }}
      - name: Check Docker Hub credentials
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          test -n "$DOCKERHUB_USERNAME" || { echo "DOCKERHUB_USERNAME secret is required" >&2; exit 1; }
          test -n "$DOCKERHUB_TOKEN" || { echo "DOCKERHUB_TOKEN secret is required" >&2; exit 1; }
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: server/go.sum
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Verify release tag
        run: |
          tag_commit=$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}")
          if [ "$tag_commit" != "$(git rev-parse HEAD)" ]; then
            echo "release tag $RELEASE_TAG does not match the checked-out commit" >&2
            exit 1
          fi
          if [ "$GITHUB_EVENT_NAME" = release ] && [ "$tag_commit" != "$GITHUB_SHA" ]; then
            echo "release tag $RELEASE_TAG does not match the release event commit" >&2
            exit 1
          fi
          echo "RELEASE_COMMIT=$tag_commit" >> "$GITHUB_ENV"
      - name: Set release metadata
        id: metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_json=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG")
          if [ "$(printf '%s' "$release_json" | jq -r '.draft')" != false ]; then
            echo "release $RELEASE_TAG must be published before building" >&2
            exit 1
          fi
          is_prerelease=$(printf '%s' "$release_json" | jq -r '.prerelease')
          {
            echo "VERSION=${RELEASE_TAG#v}"
            echo "BUILD_DATE=$(git show -s --format=%cI "$RELEASE_COMMIT")"
          } >> "$GITHUB_ENV"
          {
            echo 'tags<<EOF'
            echo "$KIRBY_IMAGE:$RELEASE_TAG"
            echo "$KIRBY_IMAGE:sha-$RELEASE_COMMIT"
            # Prerelease tags must never replace the stable image.
            if [ "$is_prerelease" = false ] && ! printf '%s' "$RELEASE_TAG" | grep -q -- '-'; then
              echo "$KIRBY_IMAGE:latest"
            fi
            echo EOF
          } >> "$GITHUB_OUTPUT"
      - name: Install protoc
        run: scripts/ci/install-protoc.sh
      - name: Run release gates
        run: |
          make ci
          scripts/test-clean-room.sh
          KIRBY_RELEASE_SOURCE_DIR="$GITHUB_WORKSPACE" \
            sh "$RUNNER_TEMP/kirby-release-check.sh" --dry-run "$RELEASE_TAG"
      - name: Generate release SBOMs
        run: |
          KIRBY_SOURCE_COMMIT="$RELEASE_COMMIT" \
            KIRBY_RELEASE_VERSION="$VERSION" \
            KIRBY_BUILD_DATE="$BUILD_DATE" \
            scripts/generate-sbom.sh
          cp dist/sbom/*.cdx.json dist/release/
          (cd dist/release && sha256sum -- kirby-* *.cdx.json > SHA256SUMS)
      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          version: v0.36.1
          driver-opts: image=moby/buildkit:v0.32.2@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8
      - name: Build and push Kirby image
        id: image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          pull: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.RELEASE_COMMIT }}
            org.opencontainers.image.version=${{ env.VERSION }}
          build-args: |
            VERSION=${{ env.VERSION }}
            COMMIT=${{ env.RELEASE_COMMIT }}
            BUILD_DATE=${{ env.BUILD_DATE }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=release-image
          cache-to: type=gha,mode=max,scope=release-image
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: Sign image manifests with GitHub OIDC
        run: |
          cosign sign --yes "${KIRBY_IMAGE}@${{ steps.image.outputs.digest }}"
      - name: Generate build provenance
        id: provenance
        uses: actions/attest-build-provenance/predicate@864457a58d4733d7f1574bd8821fa24e02cf7538 # predicate v2.0.0
      - name: Record tagged source in provenance
        env:
          BUILD_PROVENANCE: ${{ steps.provenance.outputs.predicate }}
        run: |
          printf '%s' "$BUILD_PROVENANCE" | jq \
            --arg uri "git+$GITHUB_SERVER_URL/$GITHUB_REPOSITORY@refs/tags/$RELEASE_TAG" \
            --arg commit "$RELEASE_COMMIT" \
            '.buildDefinition.resolvedDependencies += [{
              uri: $uri,
              digest: {
                gitCommit: $commit
              }
            }]' > "$RUNNER_TEMP/kirby-provenance.json"
      - name: Attest release files
        uses: actions/attest@e59cbc1ad1ac2d59339667419eb8cdde6eb61e3d # v3.2.0
        with:
          subject-path: dist/release/*
          predicate-type: ${{ steps.provenance.outputs.predicate-type }}
          predicate-path: ${{ runner.temp }}/kirby-provenance.json
      - name: Sign release files with GitHub OIDC
        run: |
          for artifact in dist/release/*; do
            cosign sign-blob --yes --bundle "$artifact.sigstore.json" "$artifact"
          done
      - name: Upload GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$RELEASE_TAG" dist/release/* --clobber
