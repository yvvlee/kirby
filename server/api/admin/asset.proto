syntax = "proto3";

package kirby.admin.v1;

import "google/api/annotations.proto";
import "common/entity.proto";
import "validate/validate.proto";

option go_package = "github.com/yvvlee/kirby/server/api/admin;adminv1";

service AssetService {
  rpc PresignAsset(PresignAssetRequest) returns (PresignAssetReply) {
    option (google.api.http) = {
      post: "/admin/environments/{environment_id}/projects/{project_id}/assets/presign"
      body: "*"
    };
  }
  rpc CompleteAsset(CompleteAssetRequest) returns (CompleteAssetReply) {
    option (google.api.http) = {
      post: "/admin/environments/{environment_id}/projects/{project_id}/assets/complete"
      body: "*"
    };
  }
}

message PresignAssetRequest {
  int64 environment_id = 1 [(validate.rules).int64 = {gt: 0}];
  int64 project_id = 2 [(validate.rules).int64 = {gt: 0}];
  string filename = 3 [(validate.rules).string = {min_len: 1, max_len: 255}];
  string content_type = 4 [(validate.rules).string = {min_len: 1, max_len: 255}];
  uint64 size = 5 [(validate.rules).uint64 = {gt: 0}];
}

message PresignAssetReply {
  string object_key = 1;
  string upload_url = 2;
  map<string, string> headers = 3;
  string expires_at = 4;
  string upload_method = 5;
  map<string, string> form_fields = 6;
}

message CompleteAssetRequest {
  int64 environment_id = 1 [(validate.rules).int64 = {gt: 0}];
  int64 project_id = 2 [(validate.rules).int64 = {gt: 0}];
  string object_key = 3 [(validate.rules).string = {min_len: 1, max_len: 1024}];
}

message CompleteAssetReply {
  kirby.common.v1.Asset asset = 1;
}
