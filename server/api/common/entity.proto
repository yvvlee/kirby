syntax = "proto3";

package kirby.common.v1;

import "common/annotation.proto";
import "common/types.proto";

option go_package = "github.com/yvvlee/kirby/server/api/common;commonv1";

message Environment {
  int64 id = 1;
  string key = 2;
  string name = 3;
  string description = 4;
  bool enabled = 5;
  string created_at = 51;
  string updated_at = 52;
  uint32 version = 55;
}

message User {
  int64 id = 1;
  string username = 2;
  string display_name = 3;
  bool enabled = 4;
  bool is_system_admin = 5;
  string created_at = 51;
  string updated_at = 52;
  uint32 version = 55;
}

message Role {
  int64 id = 1;
  string key = 2;
  string name = 3;
  string description = 4;
  bool builtin = 5;
  repeated Permission permissions = 6;
  string created_at = 51;
  string updated_at = 52;
  uint32 version = 55;
}

message Permission {
  int64 id = 1;
  string key = 2;
  string name = 3;
  string description = 4;
}

message EnvironmentMember {
  User user = 1;
  repeated Role roles = 2;
}

message Project {
  int64 id = 1;
  int64 environment_id = 2;
  string key = 3;
  string name = 4;
  string description = 5;
  string created_by = 51;
  string updated_by = 52;
  string created_at = 53;
  string updated_at = 54;
  uint32 version = 55;
}

message Config {
  int64 id = 1;
  int64 project_id = 2;
  string key = 3;
  string description = 4;
  bool is_array = 5;
  Field.Type type = 6;
  string value = 7;
  uint64 runtime_version = 8;
  string created_by = 51;
  string updated_by = 52;
  string created_at = 53;
  string updated_at = 54;
  uint32 version = 55;
}

message ConfigEnum {
  int64 id = 1;
  int64 config_id = 2;
  string key = 3;
  string name = 4;
  string description = 5;
  repeated SelectOption values = 6;
  string created_by = 51;
  string updated_by = 52;
  string created_at = 53;
  string updated_at = 54;
  uint32 version = 55;
}

message Structure {
  int64 id = 1;
  int64 config_id = 2;
  string key = 3;
  string name = 4;
  string description = 5;
  repeated Field fields = 6;
  string created_by = 51;
  string updated_by = 52;
  string created_at = 53;
  string updated_at = 54;
  uint32 version = 55;
}

message Field {
  enum BaseType {
    option (enum_meta) = {name: "字段基础类型"};

    BASE_TYPE_UNSPECIFIED = 0 [(enum_value_meta).ignore = true];
    STRING = 1 [(enum_value_meta).name = "字符串"];
    INT = 2 [(enum_value_meta).name = "整数"];
    DECIMAL = 3 [(enum_value_meta).name = "小数"];
    BOOLEAN = 4 [(enum_value_meta).name = "布尔值"];
    TIME = 5 [(enum_value_meta).name = "时间"];
    DATE = 6 [(enum_value_meta).name = "日期"];
    DATETIME = 7 [(enum_value_meta).name = "日期时间"];
    TIME_RANGE = 8 [(enum_value_meta).name = "时间范围"];
    DATE_RANGE = 9 [(enum_value_meta).name = "日期范围"];
    DATETIME_RANGE = 10 [(enum_value_meta).name = "日期时间范围"];
    IMAGE = 11 [(enum_value_meta).name = "图片"];
    VIDEO = 12 [(enum_value_meta).name = "视频"];
    FILE = 13 [(enum_value_meta).name = "文件"];
  }

  message Type {
    oneof kind {
      BaseType base_type = 1;
      string structure_key = 2;
      string enum_key = 3;
    }
  }

  string key = 1;
  string name = 2;
  string description = 3;
  bool is_array = 4;
  Type type = 5;
}

message TreeNode {
  Field value = 1;
  repeated TreeNode children = 2;
}

message Snapshot {
  enum Status {
    option (enum_meta) = {name: "快照状态"};

    STATUS_UNSPECIFIED = 0 [(enum_value_meta).ignore = true];
    UNRELEASED = 1 [(enum_value_meta).name = "未发布"];
    reserved 2;
    RELEASED = 3 [(enum_value_meta).name = "已发布"];
  }

  enum Tag {
    option (enum_meta) = {name: "快照标签"};

    TAG_UNSPECIFIED = 0 [(enum_value_meta).ignore = true];
    RELEASE = 1 [(enum_value_meta).name = "Release"];
    HOTFIX = 2 [(enum_value_meta).name = "Hotfix"];
    REVIEW = 3 [(enum_value_meta).name = "Review"];
    DEBUG = 4 [(enum_value_meta).name = "Debug"];
    DEMO = 5 [(enum_value_meta).name = "Demo"];
    REUSE = 6 [(enum_value_meta).name = "Reuse"];
  }

  int64 id = 1;
  int64 project_id = 2;
  int64 config_id = 3;
  string config_key = 4;
  string description = 5;
  string content = 6;
  Status status = 7;
  repeated Tag tags = 8;
  bool is_using = 9;
  string created_by = 51;
  string updated_by = 52;
  string created_at = 53;
  string updated_at = 54;
  uint32 version = 55;
}

message SimpleSnapshot {
  int64 id = 1;
  int64 project_id = 2;
  int64 config_id = 3;
  string config_key = 4;
  string description = 5;
  Snapshot.Status status = 6;
  repeated Snapshot.Tag tags = 7;
  bool is_using = 8;
  string created_by = 51;
  string updated_by = 52;
  string created_at = 53;
  string updated_at = 54;
  uint32 version = 55;
}

message ProjectApiKey {
  int64 id = 1;
  string public_id = 2;
  string name = 3;
  string created_by = 4;
  string created_at = 5;
  optional string last_used_at = 6;
  optional string revoked_at = 7;
  // Only the trailing characters are stored and returned for identification.
  // This value is not the secret and cannot be used to authenticate.
  string secret_suffix = 8;
}

message Asset {
  string object_key = 1;
  string url = 2;
  string content_type = 3;
  uint64 size = 4;
}
