syntax = "proto3";

package kirby.admin.v1;

import "google/api/annotations.proto";
import "google/protobuf/empty.proto";
import "kirby/common/v1/entity.proto";
import "validate/validate.proto";

option go_package = "github.com/yvvlee/kirby/server/gen/kirby/admin/v1;adminv1";

service ProjectApiKeyService {
  rpc ListProjectApiKeys(ProjectApiKeyScopeRequest) returns (ListProjectApiKeysReply) {
    option (google.api.http) = {
      get: "/admin/environments/{environment_id}/projects/{project_id}/api-keys"
    };
  }
  rpc CreateProjectApiKey(CreateProjectApiKeyRequest) returns (ProjectApiKeySecretReply) {
    option (google.api.http) = {
      post: "/admin/environments/{environment_id}/projects/{project_id}/api-keys"
      body: "*"
    };
  }
  rpc RotateProjectApiKey(ProjectApiKeyIDRequest) returns (ProjectApiKeySecretReply) {
    option (google.api.http) = {
      post: "/admin/environments/{environment_id}/projects/{project_id}/api-keys/{key_id}/rotate"
      body: "*"
    };
  }
  rpc RevokeProjectApiKey(ProjectApiKeyIDRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      delete: "/admin/environments/{environment_id}/projects/{project_id}/api-keys/{key_id}"
    };
  }
}

message ProjectApiKeyScopeRequest {
  int64 environment_id = 1 [(validate.rules).int64 = {gt: 0}];
  int64 project_id = 2 [(validate.rules).int64 = {gt: 0}];
}

message ProjectApiKeyIDRequest {
  int64 environment_id = 1 [(validate.rules).int64 = {gt: 0}];
  int64 project_id = 2 [(validate.rules).int64 = {gt: 0}];
  int64 key_id = 3 [(validate.rules).int64 = {gt: 0}];
}

message CreateProjectApiKeyRequest {
  int64 environment_id = 1 [(validate.rules).int64 = {gt: 0}];
  int64 project_id = 2 [(validate.rules).int64 = {gt: 0}];
  string name = 3 [(validate.rules).string = {min_len: 1, max_len: 64}];
}

message ListProjectApiKeysReply {
  repeated kirby.common.v1.ProjectApiKey list = 1;
}

message ProjectApiKeySecretReply {
  kirby.common.v1.ProjectApiKey api_key = 1;
  string secret = 2;
}
