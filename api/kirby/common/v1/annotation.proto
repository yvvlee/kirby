syntax = "proto3";

package kirby.common.v1;

import "google/protobuf/descriptor.proto";

option go_package = "github.com/yvvlee/kirby/server/gen/kirby/common/v1;commonv1";

extend google.protobuf.EnumOptions {
  optional EnumMeta enum_meta = 92023;
}

extend google.protobuf.EnumValueOptions {
  optional EnumValueMeta enum_value_meta = 92023;
}

message EnumMeta {
  optional string name = 1;
  optional string description = 2;
}

message EnumValueMeta {
  optional bool ignore = 1;
  optional string name = 2;
  optional string description = 3;
}
