# Copy this file before use. Every CHANGE_ME value is intentionally unusable.
mode: multi

http:
  address: ":8000"
  timeout: 10s

grpc:
  address: ":9000"
  timeout: 10s

mysql:
  dsn: "CHANGE_ME_MYSQL_USER:CHANGE_ME_MYSQL_PASSWORD@tcp(mysql:3306)/kirby?charset=utf8mb4&parseTime=true&loc=UTC"
  max_open_conns: 50
  max_idle_conns: 10
  conn_max_lifetime: 5m

cache:
  driver: redis
  redis:
    address: "redis:6379"
    username: ""
    password: "CHANGE_ME_REDIS_PASSWORD"
    db: 0
    key_prefix: "kirby:"

jwt:
  issuer: kirby
  active_kid: change-me-primary
  access_ttl: 15m
  refresh_ttl: 168h
  keys:
    change-me-primary: "CHANGE_ME_JWT_KEY"

# Every server instance must use the same API key pepper and origin list.
security:
  api_key_pepper: "CHANGE_ME_API_KEY_PEPPER"
  allowed_origins:
    - "https://kirby.example.invalid"

object_storage:
  driver: s3
  local:
    directory: ""
  s3:
    endpoint: "minio:9000"
    presign_endpoint: "localhost:9000"
    region: "us-east-1"
    bucket: "kirby"
    access_key: "CHANGE_ME_S3_ACCESS_KEY"
    secret_key: "CHANGE_ME_S3_SECRET_KEY"
    use_ssl: false
    presign_use_ssl: false
    public_base_url: "http://localhost:9000/kirby"

log:
  level: info
  format: json
