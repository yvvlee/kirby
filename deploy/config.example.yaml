# Copy this file before use. Every CHANGE_ME value is intentionally unusable.
mode: multi

http:
  address: ":8080"
  # S3 complete streams up to 64 MiB through the server while publishing an
  # immutable object. Keep this above the measured worst-case internal copy time.
  timeout: 2m

grpc:
  address: ":9090"
  timeout: 10s

database:
  driver: mysql
  dsn: "CHANGE_ME_MYSQL_USER:CHANGE_ME_MYSQL_PASSWORD@tcp(mysql:3306)/kirby?charset=utf8mb4&parseTime=true&loc=UTC"
  max_open_conns: 50
  max_idle_conns: 10
  conn_max_lifetime: 5m

cache:
  driver: redis
  redis:
    address: "redis:6379"
    username: ""
    password: "CHANGE_ME_REDIS_PASSWORD"
    db: 0
    key_prefix: "kirby:"

jwt:
  issuer: kirby
  access_ttl: 15m
  refresh_ttl: 168h

object_storage:
  driver: s3
  local:
    directory: ""
  s3:
    endpoint: "minio:9000"
    region: "us-east-1"
    bucket: "kirby"
    access_key: "CHANGE_ME_S3_ACCESS_KEY"
    secret_key: "CHANGE_ME_S3_SECRET_KEY"
    use_ssl: false

log:
  level: info
