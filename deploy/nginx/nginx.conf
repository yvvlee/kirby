worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr notice;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;
  sendfile on;

  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  resolver 127.0.0.11 valid=10s ipv6=off;

  upstream kirby_http {
    zone kirby_http 64k;
    least_conn;
    server server-1:8080 resolve;
    server server-2:8080 resolve;
  }

  upstream kirby_grpc {
    zone kirby_grpc 64k;
    least_conn;
    server server-1:9090 resolve;
    server server-2:9090 resolve;
  }

  server {
    listen 8000;
    server_name _;
    client_max_body_size 64m;

    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; form-action 'self'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;

    location = /healthz {
      proxy_pass http://kirby_http/healthz;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/ {
      proxy_pass http://kirby_http/;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_cookie_path ~^/auth(?:/|$) /api/auth;
    }

    location ~ ^/kirby(?:/|$) {
      proxy_pass http://minio:9000;
      proxy_http_version 1.1;
      proxy_request_buffering off;
      proxy_set_header Host $http_host;
      proxy_set_header Connection "";
    }

    location / {
      proxy_pass http://web:8080;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Real-IP $remote_addr;
    }
  }

  server {
    listen 9000;
    http2 on;
    server_name _;

    location / {
      grpc_pass grpc://kirby_grpc;
      grpc_set_header Host $host;
      grpc_set_header X-Forwarded-For $remote_addr;
      grpc_set_header X-Real-IP $remote_addr;
    }
  }
}
